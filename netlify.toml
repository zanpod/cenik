# EPO.SI — Netlify configuration
# Multi-page static site (no build step). Only the customer /menu route needs a
# rewrite, because the tenant slug is dynamic (/menu/<slug>?table=<token>).

[build]
  publish = "."

# Customer menu: rewrite any /menu/<slug> path to the single menu page.
# (status 200 = rewrite, URL stays the same so JS can read the slug from path.)
[[redirects]]
  from = "/menu/*"
  to = "/menu/index.html"
  status = 200

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
