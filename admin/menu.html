<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b14" />
  <title>Upravljanje menija — EPO.SI Admin</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div id="admin-shell" class="admin-shell"></div>

  <!-- Category modal -->
  <div class="modal-backdrop" id="cat-modal">
    <div class="modal glass">
      <div class="modal-head"><h2 id="cat-modal-title">Kategorija</h2><button class="btn btn-ghost btn-icon" data-close="cat-modal">✕</button></div>
      <div class="field"><label>Ime</label><input class="input" id="cat-name" placeholder="npr. Tople pijače" /></div>
      <div class="field"><label>Ikona (emoji)</label><input class="input" id="cat-icon" placeholder="☕" /></div>
      <div class="field"><label>Vrstni red</label><input class="input" type="number" id="cat-sort" value="0" /></div>
      <label class="switch"><input type="checkbox" id="cat-active" checked /><span class="track"></span><span>Aktivna</span></label>
      <div class="modal-actions">
        <button class="btn" data-close="cat-modal">Prekliči</button>
        <button class="btn btn-primary" id="cat-save">Shrani</button>
      </div>
    </div>
  </div>

  <!-- Item modal -->
  <div class="modal-backdrop" id="item-modal">
    <div class="modal glass">
      <div class="modal-head"><h2 id="item-modal-title">Izdelek</h2><button class="btn btn-ghost btn-icon" data-close="item-modal">✕</button></div>
      <div class="field"><label>Ime</label><input class="input" id="item-name" placeholder="npr. Ledeni čaj" /></div>
      <div class="field"><label>Opis</label><textarea class="textarea" id="item-desc" placeholder="Domači ledeni čaj z limono"></textarea></div>
      <div class="row">
        <div class="field" style="flex:1"><label>Cena</label><input class="input" type="number" step="0.01" id="item-price" placeholder="3.50" /></div>
        <div class="field" style="flex:1"><label>Vrstni red</label><input class="input" type="number" id="item-sort" value="0" /></div>
      </div>
      <div class="field"><label>Kategorija</label><select class="select" id="item-category"></select></div>
      <div class="row">
        <div class="field" style="flex:1"><label>Alergeni</label><input class="input" id="item-allergens" placeholder="npr. gluten, laktoza" /></div>
        <div class="field" style="width:160px"><label>Stopnja DDV (%)</label><input class="input" type="number" step="0.5" id="item-vat" placeholder="privzeto" /></div>
      </div>
      <label class="switch" style="margin:4px 0 10px"><input type="checkbox" id="item-track-stock" /><span class="track"></span><span>Sledenje zalogi (končni izdelek)</span></label>
      <div class="field" id="item-stock-field" style="display:none"><label>Zaloga (kos)</label><input class="input" type="number" id="item-stock" value="0" /></div>
      <div class="field">
        <label>Receptura — poraba sestavin na 1 kos</label>
        <div id="item-recipe-rows"></div>
        <button class="btn btn-sm" type="button" id="item-add-ingredient" style="margin-top:6px">＋ Dodaj sestavino</button>
        <div class="muted" style="font-size:.78rem;margin-top:6px">Npr. Kava z mlekom: Kava 8 (g) + Mleko 10 (ml). Ob prodaji se samodejno odpiše iz zaloge surovin.</div>
      </div>
      <div class="field"><label>Slika</label><input class="input" type="file" id="item-image" accept="image/*" /><div id="item-image-preview" class="muted" style="margin-top:6px"></div></div>
      <label class="switch"><input type="checkbox" id="item-available" checked /><span class="track"></span><span>Na voljo</span></label>
      <div class="modal-actions">
        <button class="btn" data-close="item-modal">Prekliči</button>
        <button class="btn btn-primary" id="item-save">Shrani</button>
      </div>
    </div>
  </div>

  <!-- Ingredients / stock modal -->
  <div class="modal-backdrop" id="ing-modal">
    <div class="modal glass">
      <div class="modal-head"><h2>📦 Surovine in zaloge</h2><button class="btn btn-ghost btn-icon" data-close="ing-modal">✕</button></div>
      <div id="ing-list"></div>
      <h3 style="margin:18px 0 8px">Nova surovina</h3>
      <div class="row wrap" style="align-items:flex-end">
        <div class="field" style="flex:1;margin:0"><label>Naziv</label><input class="input" id="ing-name" placeholder="npr. Kava" /></div>
        <div class="field" style="width:110px;margin:0"><label>Enota</label>
          <select class="select" id="ing-unit"><option>g</option><option>ml</option><option>kos</option><option>l</option><option>kg</option></select>
        </div>
        <div class="field" style="width:120px;margin:0"><label>Zaloga</label><input class="input" type="number" step="0.001" id="ing-stock" value="0" /></div>
        <button class="btn btn-primary" id="ing-add">Dodaj</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin-auth.js"></script>
  <script src="/js/menu-manage.js"></script>
</body>
</html>
