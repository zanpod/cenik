<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17130f" />
  <title>EPO.SI — Digitalni meni in naročanje za mizo</title>
  <meta name="description" content="EPO.SI — digitalni meni in naročanje za mizo za bare, restavracije in kavarne." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <link rel="stylesheet" href="/css/common.css" />
  <style>
    .landing {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .landing-card {
      max-width: 440px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
    }
    .logo-mark {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .landing-card p { color: var(--text-1); }
    .landing-actions { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-card glass">
      <div class="logo-mark">EPO.SI</div>
      <p class="muted">Digitalni meni &amp; naročanje za mizo</p>
      <p>Skenirajte QR kodo na vaši mizi za ogled menija in oddajo naročila.</p>
      <div class="landing-actions">
        <a class="btn btn-primary btn-block" href="/admin/">Prijava za osebje</a>
      </div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
